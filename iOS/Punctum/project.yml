name: Punctum
options:
  bundleIdPrefix: com.punctum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.5.5"
    CURRENT_PROJECT_VERSION: "55"
    CODE_SIGN_STYLE: Automatic
targets:
  Punctum:
    type: application
    platform: iOS
    sources:
      - path: Punctum
      - path: ../../app/src/main/res/drawable/ticket_paper_texture.jpg
        buildPhase: resources
      - path: ../../app/src/main/res/drawable/postcard_footer_paper_texture.jpg
        buildPhase: resources
      - path: ../../app/src/main/res/drawable/reversal_film_paper_texture.jpg
        buildPhase: resources
      - path: ../../app/src/main/res/font/newsreader_regular.ttf
        buildPhase: resources
      - path: ../../app/src/main/res/font/newsreader_semibold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chessyyq.punctum
        PRODUCT_NAME: Punctum
        DEVELOPMENT_TEAM: YJTQFDXG3N
        INFOPLIST_FILE: Punctum/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphonesimulator*]": ""
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]": Assets.xcassets
        INFOPLIST_KEY_CFBundleDisplayName: Punctum
    scheme:
      testTargets:
        - PunctumTests
  PunctumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PunctumTests
    dependencies:
      - target: Punctum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chessyyq.punctum.tests
        GENERATE_INFOPLIST_FILE: YES
